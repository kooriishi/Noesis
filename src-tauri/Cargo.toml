[package]
name = "noesis"
version = "0.1.0"
description = "NOESIS - Code-Learning Desktop IDE"
authors = ["Noesis Team"]
edition = "2021"

[lib]
name = "noesis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Internal Crates
noesis-project = { path = "crates/project" }
noesis-indexer = { path = "crates/indexer" }
noesis-lsp = { path = "crates/lsp" }
noesis-llm = { path = "crates/llm" }
noesis-learn = { path = "crates/learn" }
noesis-runner = { path = "crates/runner" }
noesis-store = { path = "crates/store" }
noesis-ros2 = { path = "crates/ros2" }
noesis-llmapp = { path = "crates/llmapp" }

[workspace]
members = [
    ".",
    "crates/project",
    "crates/indexer",
    "crates/lsp",
    "crates/llm",
    "crates/learn",
    "crates/runner",
    "crates/store",
    "crates/ros2",
    "crates/llmapp",
    "crates/eval",
    "crates/linux-app",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
