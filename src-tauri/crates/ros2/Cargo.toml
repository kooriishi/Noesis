[package]
name = "noesis-ros2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dump_ros2_graph"
path = "src/bin/dump_ros2_graph.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
regex = "1.11"
walkdir = "2.5"
noesis-project = { path = "../project" }
noesis-store = { path = "../store" }
noesis-indexer = { path = "../indexer" }
