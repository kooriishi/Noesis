[package]
name = "noesis-linux"
version = "0.1.1"
edition = "2021"
description = "NOESIS - Code-Learning Desktop IDE (Linux x86_64 Runtime)"

[[bin]]
name = "noesis"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"

noesis-project = { path = "../project" }
noesis-indexer = { path = "../indexer" }
noesis-lsp = { path = "../lsp" }
noesis-llm = { path = "../llm" }
noesis-learn = { path = "../learn" }
noesis-runner = { path = "../runner" }
noesis-store = { path = "../store" }
noesis-ros2 = { path = "../ros2" }
noesis-llmapp = { path = "../llmapp" }
