[package]
name = "noesis-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
regex = "1.11"
tracing = "0.1"
sha2 = "0.10"
chrono = "0.4"
ignore = "0.4"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-cpp = "0.23"
noesis-project = { path = "../project" }
noesis-store = { path = "../store" }
