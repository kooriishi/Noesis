[package]
name = "noesis-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
thiserror = "2.0"
regex = "1.11"
tracing = "0.1"
walkdir = "2"
noesis-store = { path = "../store" }
noesis-project = { path = "../project" }
noesis-learn = { path = "../learn" }

[dev-dependencies]
tempfile = "3"
